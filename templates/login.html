{% extends "base.html" %}
{% block title %}登录 - 学生管理系统{% endblock %}
{% block content %}
<h2>登录</h2>
<form method="post" action="/login">
    <div class="form-group">
        <label>登录角色：</label>
        <select name="role">
            <option value="1">管理员</option>
            <option value="2">普通老师</option>
        </select>
    </div>
    <div class="form-group">
        <label>密码：</label>
        <input type="password" name="password" placeholder="请输入密码（老师可留空）">
    </div>
    <button type="submit" class="btn btn-primary">登录</button>
</form>
{% endblock %}
