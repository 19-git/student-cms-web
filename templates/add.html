{% extends "base.html" %}
{% block title %}添加学生{% endblock %}
{% block content %}
<h2>添加学生</h2>
<form method="post" action="/add">
    <div class="form-group">
        <label>姓名：</label>
        <input name="name" value="{{ name or '' }}">
    </div>
    <div class="form-group">
        <label>性别：</label>
        <select name="gender">
            <option value="男" {% if gender == '男' %}selected{% endif %}>男</option>
            <option value="女" {% if gender == '女' %}selected{% endif %}>女</option>
        </select>
    </div>
    <div class="form-group">
        <label>年龄：</label>
        <input name="age" value="{{ age or '' }}">
    </div>
    <div class="form-group">
        <label>电话：</label>
        <input name="phone" value="{{ phone or '' }}">
    </div>
    <div class="form-group">
        <label>描述：</label>
        <input name="desc" value="{{ desc or '' }}">
    </div>
    <button type="submit" class="btn btn-primary">保存</button>
    <a class="btn btn-default" href="{{ url_for('student_list') }}">返回</a>
</form>
{% endblock %}
